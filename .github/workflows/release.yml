name: Release

# v* tags build the macOS app and publish a draft GitHub Release.
# Manual runs (workflow_dispatch) only build and upload workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Rust target to build
        type: choice
        default: universal-apple-darwin
        options:
          - universal-apple-darwin
          - aarch64-apple-darwin
          - x86_64-apple-darwin

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.target || 'universal-apple-darwin' }}

jobs:
  # Runs before any approval or secret: a v* tag is only released from a
  # commit that is already on main. Rulesets can't check this. Manual runs
  # skip it (they build ad-hoc and never publish).
  tag-on-main:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require the tagged commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Delete the tag and tag a commit that is on main."
            exit 1
          fi
          echo "OK: $GITHUB_REF_NAME ($GITHUB_SHA) is on main."

  build-macos:
    needs: tag-on-main
    # tag-on-main is skipped on manual runs, so don't require its success.
    if: ${{ !cancelled() && needs.tag-on-main.result != 'failure' }}
    runs-on: macos-latest
    # BUS-59/BUS-96: signing and notarization secrets live only in the
    # protected 'release' Environment, so tag pushes must enter it to sign.
    # Same condition as the publish job: manual runs (even on a tag ref) use
    # no environment, need no approval and build ad-hoc. The step env below
    # also blanks every APPLE_* secret outside tag pushes.
    environment: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || '' }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.package.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # The cleanup worker (BUS-16 3c-2b) is its own crate with its own
      # target dir; caching it saves the per-arch llama.cpp cmake build.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            src-tauri/worker
          key: ${{ env.TARGET }}
      - name: Install cmake
        run: command -v cmake || brew install cmake
      - run: npm ci
      - name: Check manifest versions
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            npm run release:check-version -- "$GITHUB_REF_NAME"
          else
            npm run release:check-version
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # BUS-119: cargo, npm and the worker's cmake build run dependency
      # build scripts, so this step gets no secrets at all.
      - name: Compile app and worker (no secrets)
        run: bash scripts/release/build-macos.sh "$TARGET"
      # Only this step gets the signing secrets, and it compiles nothing.
      # With the secrets present, Tauri imports APPLE_CERTIFICATE into a
      # temporary keychain (random password, deleted when the build exits),
      # signs the .app and .dmg, then notarizes and staples the .app.
      # With none present, bundle-macos.sh bundles today's ad-hoc app.
      # Every APPLE_* value is '' unless this is a tag push, so manual runs
      # stay ad-hoc even if same-named repository-level secrets exist.
      - name: Bundle, sign and notarize
        env:
          APPLE_CERTIFICATE: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_PRIVATE_KEY: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_API_PRIVATE_KEY || '' }}
        run: bash scripts/release/bundle-macos.sh "$TARGET"
      # Signed builds: notarytool submit --wait + stapler staple on the .dmg,
      # then spctl. The entitlements check also asserts the Developer ID
      # signature and TeamIdentifier (APPLE_TEAM_ID is required when signed).
      - name: Package, verify and checksum
        id: package
        env:
          APPLE_SIGNING_IDENTITY: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.APPLE_API_ISSUER || '' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/release/package-macos.sh "$TARGET" "$VERSION" "$SIGNED"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
      - name: Remove App Store Connect key
        if: always()
        run: |
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then rm -f "$APPLE_API_KEY_PATH"; fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voxloom-macos-${{ env.TARGET }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build-macos
    runs-on: ubuntu-latest
    # BUS-59: publishing needs approval from a required reviewer on the 'release' Environment.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist-release
          merge-multiple: true
      - name: Render release notes
        env:
          VERSION: ${{ needs.build-macos.outputs.version }}
          SIGNED: ${{ needs.build-macos.outputs.signed }}
        run: |
          if [[ "$SIGNED" == "true" ]]; then
            note="This build is signed with a Developer ID and notarized by Apple."
          else
            note="> [!WARNING]
          > **UNSIGNED build.** This app is ad-hoc signed and not notarized, so macOS
          > Gatekeeper will block it on first launch. To open it: right-click
          > Voxloom.app → Open → Open, or run
          > \`xattr -dr com.apple.quarantine /Applications/Voxloom.app\`."
          fi
          export note
          node -e '
            const fs = require("fs");
            const t = fs.readFileSync(".github/release-notes.md", "utf8");
            fs.writeFileSync("release-notes.md", t
              .replaceAll("{{VERSION}}", process.env.VERSION)
              .replace("{{SIGNING_NOTE}}", process.env.note));'
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.build-macos.outputs.signed }}
        run: |
          title="Voxloom $GITHUB_REF_NAME"
          [[ "$SIGNED" == "true" ]] || title="$title (UNSIGNED)"
          bash scripts/release/publish.sh "$GITHUB_REF_NAME" "$title" \
            release-notes.md dist-release
