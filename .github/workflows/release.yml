name: Release

# v* tags build the macOS app and publish a draft GitHub Release.
# Manual runs (workflow_dispatch) only build and upload workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Rust target to build
        type: choice
        default: universal-apple-darwin
        options:
          - universal-apple-darwin
          - aarch64-apple-darwin
          - x86_64-apple-darwin

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.target || 'universal-apple-darwin' }}

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.package.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ env.TARGET }}
      - name: Install cmake
        run: command -v cmake || brew install cmake
      - run: npm ci
      - name: Check manifest versions
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            npm run release:check-version -- "$GITHUB_REF_NAME"
          else
            npm run release:check-version
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build app and dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash scripts/release/build-macos.sh "$TARGET"
      - name: Package, verify and checksum
        id: package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/release/package-macos.sh "$TARGET" "$VERSION" "$SIGNED"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
      - name: Remove App Store Connect key
        if: always()
        run: |
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then rm -f "$APPLE_API_KEY_PATH"; fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
      - uses: actions/upload-artifact@v4
        with:
          name: voxloom-macos-${{ env.TARGET }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Render release notes
        env:
          VERSION: ${{ needs.build-macos.outputs.version }}
          SIGNED: ${{ needs.build-macos.outputs.signed }}
        run: |
          if [[ "$SIGNED" == "true" ]]; then
            note="This build is signed with a Developer ID and notarized by Apple."
          else
            note="> [!WARNING]
          > **UNSIGNED build.** This app is ad-hoc signed and not notarized, so macOS
          > Gatekeeper will block it on first launch. To open it: right-click
          > Voxloom.app → Open → Open, or run
          > \`xattr -dr com.apple.quarantine /Applications/Voxloom.app\`."
          fi
          export note
          node -e '
            const fs = require("fs");
            const t = fs.readFileSync(".github/release-notes.md", "utf8");
            fs.writeFileSync("release-notes.md", t
              .replaceAll("{{VERSION}}", process.env.VERSION)
              .replace("{{SIGNING_NOTE}}", process.env.note));'
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.build-macos.outputs.signed }}
        run: |
          title="Voxloom $GITHUB_REF_NAME"
          [[ "$SIGNED" == "true" ]] || title="$title (UNSIGNED)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; updating assets and notes."
            gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$title" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist-release/* \
              --draft --verify-tag --title "$title" \
              --notes-file release-notes.md --generate-notes
          fi
