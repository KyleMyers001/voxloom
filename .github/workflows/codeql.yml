name: CodeQL (advanced)

on:
  pull_request:
    branches: [main, 'ui/**']
  push:
    branches: [main]
  schedule:
    - cron: '37 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-advanced-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            os: ubuntu-latest
          - language: python
            build-mode: none
            os: ubuntu-latest
          - language: rust
            build-mode: none
            os: ubuntu-latest
          # Match the benchmarked ARM runner; Xcode 27 is unsupported by CodeQL.
          - language: swift
            build-mode: manual
            os: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Stage this workflow alongside default setup without replacing its alerts.
      # See .github/codeql/README.md for the explicitly approved cutover.
      - name: Explain preview mode
        if: vars.CODEQL_ADVANCED_SETUP != 'true'
        run: echo '::notice::Preview mode; SARIF is saved as an artifact. Default setup remains responsible for published alerts.'

      # Pin the benchmarked toolchain; CodeQL does not support Swift 6.4 / Xcode 27.
      - name: Select the supported Swift toolchain
        if: matrix.language == 'swift'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          swift --version
          uname -m

      # Only download/checkouts are reusable: cached compiler outputs can make
      # SwiftPM skip the compilation CodeQL needs to observe.
      - name: Cache Swift dependency downloads
        if: matrix.language == 'swift'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            src-tauri/parakeet-worker/.build/artifacts
            src-tauri/parakeet-worker/.build/checkouts
            src-tauri/parakeet-worker/.build/repositories
          key: codeql-swift-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/parakeet-worker/Package.swift', 'src-tauri/parakeet-worker/Package.resolved') }}

      # Resolve before tracing, but compile all product sources after init.
      - name: Resolve Swift dependencies before tracing
        if: matrix.language == 'swift'
        run: swift package --package-path src-tauri/parakeet-worker --disable-automatic-resolution resolve

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # ARM64 is deliberate: LocalASR's production implementation is conditional
      # on arch(arm64). Building for the Intel host would analyze its stub instead.
      # FluidAudio is compiled under tracing too; no product outputs are cached.
      - name: Build the Swift helper for Apple Silicon
        if: matrix.language == 'swift'
        run: >-
          swift build --package-path src-tauri/parakeet-worker
          --disable-automatic-resolution --product voxloom-parakeet-worker
          --arch arm64

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          # Publish only after the extraction coverage guard passes.
          upload: never
          upload-database: ${{ vars.CODEQL_ADVANCED_SETUP == 'true' }}

      - name: Verify Swift extraction coverage
        if: matrix.language == 'swift'
        run: node scripts/ci/check-swift-codeql-coverage.mjs codeql-results/swift.sarif

      - name: Publish alerts
        # GitHub rejects advanced-setup uploads while default setup is enabled.
        if: vars.CODEQL_ADVANCED_SETUP == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: codeql-results/
          category: /language:${{ matrix.language }}

      - name: Save analysis results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results/
          if-no-files-found: warn
          retention-days: 7
