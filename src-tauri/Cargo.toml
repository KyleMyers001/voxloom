[package]
name = "voxloom"
version = "0.1.0"
description = "Voxloom mock-backed UI shell"
authors = ["Voxloom contributors"]
edition = "2021"

[lib]
name = "voxloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Links whisper.cpp via whisper-rs. Requires cmake + a C++ toolchain.
# Enable on macOS for real local transcription:
#   cargo tauri build --features whisper
#   npm run tauri -- build -- --features whisper
whisper = ["dep:whisper-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "=0.17.3"
ringbuf = "0.4"
rubato = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-global-shortcut = "2"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
whisper-rs = { version = "0.13", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", features = [
  "AVCaptureDevice",
  "AVMediaFormat",
] }
objc2-core-audio = { version = "0.3.2", features = [
  "AudioHardware",
  "block2",
  "dispatch2",
] }
objc2-core-foundation = { version = "0.3.2", features = ["CFString"] }
objc2-foundation = "0.3.2"
dispatch2 = "0.3.1"
