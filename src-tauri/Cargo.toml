[package]
name = "voxloom"
version = "0.1.0"
description = "Voxloom mock-backed UI shell"
authors = ["Voxloom contributors"]
edition = "2021"

[lib]
name = "voxloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.15"
ringbuf = "0.4"
rubato = "0.14"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", features = [
  "AVCaptureDevice",
  "AVMediaFormat",
] }
objc2-foundation = "0.3.2"
